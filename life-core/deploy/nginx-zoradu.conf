# Install after the TLS certificate for lifeee.zoradu.cn exists.
# Place in /etc/nginx/sites-available/lifeee.zoradu.cn and enable it in sites-enabled.

server {
    listen 80;
    listen [::]:80;
    server_name lifeee.zoradu.cn;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name lifeee.zoradu.cn;

    ssl_certificate /etc/letsencrypt/live/lifeee.zoradu.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lifeee.zoradu.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 6m;

    location = /v1/life-core/media/upload {
        client_max_body_size 6m;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_pass http://127.0.0.1:8084;
    }

    location = /v1/life-core/media/authorize {
        return 404;
    }

    location ^~ /media/ {
        auth_request /_life_media_auth;
        alias /var/lib/lifeee/media/;
        autoindex off;
        expires 1h;
        add_header Cache-Control "private, max-age=3600" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location = /_life_media_auth {
        internal;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_pass http://127.0.0.1:8084/v1/life-core/media/authorize?;
    }

    location ^~ /v1/life-core/ {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_pass http://127.0.0.1:8084;
    }
}
